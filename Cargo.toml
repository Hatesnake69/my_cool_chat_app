[package]
name = "my_cool_chat_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.9.0"          # Для веб-фреймворка
serde = { version = "1.0.217", features = ["derive"] } # Для сериализации/десериализации
utoipa = "5.3.1"
utoipa-swagger-ui = { version = "8.1.1", features = ["actix-web"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
jsonwebtoken = "9.3.0"       # Для работы с JWT
uuid = "1.11.0"               # Для генерации уникальных идентификаторов
chrono = { version = "0.4.39", features = ["serde"] }
env_logger = "0.11.6"        # Для логирования
dotenv = "0.15.0"            # Для загрузки конфигурации из .env
tokio = { version = "1.42.0", features = ["full"] }    # Асинхронный рантайм
clap = { version = "4.3", features = ["derive"] }
serde_json = "1.0.135"
[package]
name = "my_cool_chat_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.0"          # Для веб-фреймворка
serde = { version = "1.0", features = ["derive"] } # Для сериализации/десериализации
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }
jsonwebtoken = "9.0"       # Для работы с JWT
uuid = "1.3"               # Для генерации уникальных идентификаторов
chrono = "0.4"             # Для работы с датами
env_logger = "0.10"        # Для логирования
dotenv = "0.15"            # Для загрузки конфигурации из .env
tokio = { version = "1", features = ["full"] }    # Асинхронный рантайм